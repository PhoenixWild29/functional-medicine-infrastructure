# ============================================================
# CompoundIQ — Continuous Integration
# ============================================================
# Runs on every push to main and every PR targeting main.
# All 4 jobs must pass before merge is allowed.
#
# Jobs: lint → typecheck → test → build (parallel where possible)
#
# E2E (one shared E2E Supabase project, so one run at a time) runs for
# pull requests, nightly on main and by hand, not on pushes to main: a
# merge's push run used to take the shared slot in the same minute as the
# next PR's run, so that PR waited a whole E2E run (11 to 15 min) for a
# check of code its own PR run had already passed.
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # manual runs (E2E included), e.g. on main after a risky merge
  schedule:
    # Nightly E2E on main, 07:30 UTC (after the 06:00 UTC recon cron): the
    # safety net for anything that merged without a PR E2E on the final
    # merge result. Lint, tsc, Jest and Build run too.
    - cron: '30 7 * * *'

concurrency:
  group: ci-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ── Job 1: Lint ──────────────────────────────────────────────
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (zero warnings allowed)
        run: npm run lint

  # ── Job 2: Type check ────────────────────────────────────────
  typecheck:
    name: Type Check (tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run type-check

  # ── Job 3: Unit Tests ────────────────────────────────────────
  test:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          # Stub env vars so modules that import serverEnv don't throw during test
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          JWT_SECRET: test-jwt-secret-min-32-chars-long-enough
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── Job 4: Build ─────────────────────────────────────────────
  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate required environment variables
        run: |
          required_vars=(
            "NEXT_PUBLIC_SUPABASE_URL"
            "NEXT_PUBLIC_SUPABASE_ANON_KEY"
            "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
            "NEXT_PUBLIC_SENTRY_DSN"
          )
          missing=()
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "ERROR: Missing required environment variables: ${missing[*]}"
            exit 1
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          NEXT_TELEMETRY_DISABLED: '1'

      # NB-2: removed build output cache — no restore step consumes it,
      # so saving it provides no benefit and wastes cache quota.

  # ── Job 5a: What changed (decides whether E2E is needed) ──────
  # A pull request that changes only documentation (top-level *.md, docs/,
  # reviews/) cannot change what E2E tests, so it does not take the shared
  # E2E slot. Any other file runs E2E, including src/content/legal/*.md
  # (rendered by the legal pages), as does any non-PR event.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this change need E2E?
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "$files"
          code=$(echo "$files" | grep -vE '(^[^/]+\.md$|^docs/|^reviews/)' | grep -v '^$' || true)
          if [ -n "$code" ]; then echo "e2e=true" >> "$GITHUB_OUTPUT"; else echo "Documentation only: E2E skipped."; echo "e2e=false" >> "$GITHUB_OUTPUT"; fi

  # ── Job 5: E2E Tests (Playwright) ────────────────────────────
  # Runs after unit tests AND build pass. Skipped on fork PRs (secrets
  # unavailable). The 8-step Stripe happy path test inside the suite
  # skips gracefully when STRIPE_WEBHOOK_FORWARDING is not set.
  #
  # Full E2E refresh campaign landed 2026-04-21 — PRs #4, #5, #8–#19.
  # All failing tests fixed at the root: wizard rewritten for cascading
  # builder (PR #8), signature canvas coverage split (Path B, PR #15),
  # HIPAA timer moved to jest (PR #12), checkout split into page-render
  # + API-level (PR #16/#17), ops reroute DB-truth assertion (PR #19).
  # Supabase Auth rate limits bumped to 300 req/5min for sign-ins and
  # token refresh so the suite doesn't throttle itself in the 30-default
  # free-tier cap. (That dispatch, 2026-04: 65 passed / 0 failed /
  # 5 skipped in 2.1 min, on a much smaller suite.)
  #
  # 2026-10: the suite has grown, and full E2E jobs now take 10-15 min
  # (#196 10 min, #194 11 min, #197 15 min); a 15-min cap cut #195 off.
  # 30 min leaves headroom without letting a hung run hold the shared
  # E2E project (runs are serialized below) for long.
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # full jobs take 10-15 min as of 2026-10; see the note above
    needs: [changes, test, build]
    # Serialize E2E across ALL branches/PRs: the job seeds and cleans one
    # shared E2E Supabase project, so concurrent runs corrupt each other's
    # fixtures. A running E2E is never cancelled by another run
    # (cancel-in-progress: false). GitHub keeps at most ONE pending job per
    # group: a third E2E queued while one runs and one waits replaces the
    # waiting one, which is why pushes to main no longer queue here.
    concurrency:
      group: e2e-shared-supabase-project
      cancel-in-progress: false
    # Pull requests from this repository (fork PRs have no secrets) that
    # change more than documentation; the nightly run; manual runs. Not
    # pushes to main.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && needs.changes.outputs.e2e == 'true')
      || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Keyed on the Playwright version, not the whole lockfile: the
      # browsers only change with Playwright, and any dependency bump used
      # to miss the cache and download all browsers again.
      - name: Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # apt mirror hangs (Oct 23 2026, #247 and #248): cap each attempt and retry.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            if timeout 110 npx playwright install-deps; then exit 0; fi
            echo "playwright install-deps attempt $attempt failed or timed out"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "playwright install-deps failed 3 times"
          exit 1

      # Keep the E2E Supabase project's schema in sync with supabase/migrations/.
      # Uses the session-pooler connection string. E2E_DATABASE_URL must be a
      # fully percent-encoded Postgres connection string (e.g. from `supabase db
      # connection-string --linked` against the E2E project).
      # Supabase CLI pinned: supabase@2.121.0 (Oct 14, 2026) ships no linux-x64
      # binary ("No matching Supabase CLI binary package found"), so an unpinned
      # npx broke every E2E run. 2.120.0 is the last version that ran green here.
      - name: Sync E2E Supabase schema (apply migrations)
        run: npx supabase@2.120.0 db push --db-url "$E2E_DATABASE_URL" --include-all --yes
        env:
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}

      # Playwright's webServer runs `npm run start`, which requires a production
      # build. We do NOT use `next dev` in CI — it previously hung 50+ minutes
      # because of HMR compilation under CI resource constraints. Building here
      # produces a deterministic artifact that `next start` can cold-boot in
      # under 10 seconds. NEXT_PUBLIC_* vars are passed at build time as
      # defence-in-depth: Next.js inlines any direct `process.env.NEXT_PUBLIC_*`
      # references into client bundles at build, so these must be the E2E
      # values — same values the runtime step below uses, so builds stay
      # environment-consistent.
      # Turbopack's build cache (Next 16.3+, on by default) lives in
      # .next/cache. Restored from the newest E2E build on any key; Next
      # checks every cached entry against its inputs, so a stale entry is
      # rebuilt, never reused.
      - name: Cache Next.js build cache (E2E build)
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-e2e-${{ runner.os }}-

      - name: Build Next.js app (for Playwright webServer)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL:           ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY:      ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SENTRY_DSN:             ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_TELEMETRY_DISABLED:            '1'

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: 'true'
          # E2E runs against an ISOLATED Supabase project, never production.
          # All browser-side, server-side, and test-side clients point at E2E_SUPABASE_*.
          # ── Next.js public vars (injected into browser bundle) ──
          NEXT_PUBLIC_SUPABASE_URL:            ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY:       ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:  ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SENTRY_DSN:              ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          # ── Server-side vars (used by Next.js API routes) ──
          SUPABASE_URL:                        ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY:                   ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:           ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          # ── Playwright test-side vars (read directly by seed.ts + specs) ──
          E2E_SUPABASE_URL:                    ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY:       ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL:                        ${{ secrets.E2E_DATABASE_URL }}
          STRIPE_SECRET_KEY:                   ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET:               ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          JWT_SECRET:                          ${{ secrets.JWT_SECRET }}
          CHECKOUT_TOKEN_EXPIRY:               '3600'
          APP_BASE_URL:                        'http://localhost:3000'
          # ── Sentry (optional — source maps + release tracking) ──
          SENTRY_AUTH_TOKEN:                   ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG:                          ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT:                      ${{ secrets.SENTRY_PROJECT }}
          # ── Feature flags: suppress external services in CI ──────
          TWILIO_ENABLED:   'false'
          DOCUMO_ENABLED:   'false'
          # Compliance C3: multi-factor sign-in enforced for the dedicated
          # E2E account only (e2e/mfa.spec.ts). REQUIRE_MFA stays unset, so
          # every other test account signs in with a password, as before.
          MFA_ENFORCED_EMAILS: 'test-mfa-admin@compoundiq.test'
          # Patient Intake PR 4: a placeholder so New Prescription offers
          # "Drop a face sheet". e2e/face-sheet-fill.spec.ts answers the read
          # in the browser (page.route), so no request reaches Anthropic.
          ANTHROPIC_API_KEY: 'sk-ant-e2e-placeholder-never-used'
          # WO-99: batch signing forms one payment group per patient, as in
          # production (flag on since 2026-06-14). The E2E clinic's Connect
          # account is poc_placeholder, so the group PaymentIntent carries no
          # transfer, and no test ever confirms it — nothing is charged.
          PHASE_C_GROUPS_ENABLED: 'true'
          # HIPAA B7: the app runs under `next start` (NODE_ENV=production),
          # where the prescription binding key is required. An E2E-only value,
          # not a secret: the E2E project holds test data only, and production
          # and preview have their own RX_BINDING_SECRET (docs/ops/rx-binding-key.md).
          RX_BINDING_SECRET: 'e2e-only-rx-binding-key-not-a-secret-0123456789'
          # ── Misc ─────────────────────────────────────────────────
          NEXT_TELEMETRY_DISABLED: '1'
          # PLAYWRIGHT_BASE_URL intentionally omitted — playwright.config.ts
          # starts a local `next dev` server when this is not set.
          # Set this secret if you prefer to run E2E against a Vercel preview URL.

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit XML results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-junit
          path: test-results/junit.xml
          retention-days: 14
