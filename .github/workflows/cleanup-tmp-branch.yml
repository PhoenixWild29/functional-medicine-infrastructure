# ============================================================
# One-time cleanup: delete the stray `tmp-binary-safety-test`
# branch. The GitHub MCP toolchain used to manage this repo has
# no branch-delete tool, so this disposable workflow does it via
# GITHUB_TOKEN. It runs once when this file lands on main (self-
# path trigger below) and can be re-run via workflow_dispatch.
# Delete this file once the branch is confirmed gone.
# ============================================================

name: Cleanup Temp Branch (one-time)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-tmp-branch.yml'

permissions:
  contents: write

jobs:
  delete-tmp-branch:
    name: Delete tmp-binary-safety-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete stray branch (no-op if already gone)
        run: git push origin --delete tmp-binary-safety-test || true
