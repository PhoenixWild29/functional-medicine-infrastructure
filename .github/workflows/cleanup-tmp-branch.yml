# ============================================================
# One-time cleanup: delete stale branches. For every branch
# except main, this checks whether a MERGED pull request used it
# as head; if yes, the branch's work is already in main and the
# branch is deleted. Branches with no merged PR are kept and
# listed in the log (except tmp-binary-safety-test, an old
# experiment deleted explicitly). Runs once when this file lands
# on main; re-runnable via workflow_dispatch. Delete this file
# once the sweep is confirmed.
# ============================================================

name: Cleanup Stale Branches (one-time)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-tmp-branch.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: Delete merged + stray branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete stray experiment branch (no PR)
        run: git push origin --delete tmp-binary-safety-test || true

      - name: Delete branches whose PRs are merged
        run: |
          for BR in $(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##'); do
            if [ "$BR" = "main" ]; then continue; fi
            MERGED=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BR" --state merged --json number --jq 'length' || echo 0)
            if [ "${MERGED:-0}" -gt 0 ]; then
              echo "DELETE (merged PR found): $BR"
              git push origin --delete "$BR" || true
            else
              echo "KEEP  (no merged PR):    $BR"
            fi
          done
